<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Icon Composer background layer: morning-light gradient, no transparency. iOS applies the squircle mask. -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B865"/>
      <stop offset="0.55" stop-color="#E8871E"/>
      <stop offset="1" stop-color="#B8620C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#FFF3DF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF3DF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sun)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
</svg>

# Solid Queue recurring schedule (docs/specs/auth-and-accounts.md R-16, R-29).
shared: &shared
  session_sweep:
    class: SessionSweepJob
    queue: default
    schedule: at 3am every day
  account_purge:
    class: AccountPurgeJob
    queue: default
    schedule: at 4am every day

development:
  <<: *shared

production:
  <<: *shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

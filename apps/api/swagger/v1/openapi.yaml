                type: string
                format: uuid
              name:
                type: string
              address_line1:
                type: string
                nullable: true
              address_line2:
                type: string
                nullable: true
              city:
                type: string
                nullable: true
              region:
                type: string
                nullable: true
              postal_code:
                type: string
                nullable: true
              country:
                type: string
              timezone:
                type: string
              location:
                type: object
                properties:
                  lat:
                    type: number
                  lng:
                    type: number
                required:
                - lat
                - lng
            required:
            - id
            - name
            - address_line1
            - address_line2
            - city
            - region
            - postal_code
            - country
            - timezone
            - location
          upcoming_occurrences:
            type: array
            maxItems: 4
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                timezone:
                  type: string
                going_count:
                  type: integer
                status:
                  type: string
                  enum:
                  - scheduled
                  - cancelled
                  - completed
                override_note:
                  type: string
                  nullable: true
              required:
              - id
              - starts_at
              - ends_at
              - timezone
              - going_count
              - status
              - override_note
          sponsorships:
            type: array
            items:
              type: object
              properties:
                sponsor:
                  "$ref": "#/components/schemas/SponsorSummary"
                role:
                  type: string
                  enum:
                  - presented_by
                  - coffee
                  - vendor
                  - partner

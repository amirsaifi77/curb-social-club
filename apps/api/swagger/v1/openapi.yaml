---
openapi: 3.0.1
info:
  title: Curb Social Club API
  version: v1
  description: REST API for Curb Social Club. Public read endpoints work without a
    token.
paths:
  "/v1/auth/apple":
    post:
      summary: Sign in with Apple
      description: Verifies the identity token against Apple's JWKS and returns an
        opaque session token. full_name only arrives from Apple on first authorization.
        201 when the account is new, 200 otherwise.
      tags:
      - Auth
      parameters:
      - name: X-Device-Id
        in: header
        schema:
          type: string
          format: uuid
        required: false
      responses:
        '201':
          description: new account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        "$ref": "#/components/schemas/User"
                      is_new:
                        type: boolean
                    required:
                    - token
                    - user
                    - is_new
                required:
                - data
        '200':
          description: existing account signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        "$ref": "#/components/schemas/User"
                      is_new:
                        type: boolean
                    required:
                    - token
                    - user
                    - is_new
                required:
                - data
        '401':
          description: token could not be verified
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: account suspended
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identity_token:
                  type: string
                authorization_code:
                  type: string
                nonce:
                  type: string
                  description: Raw nonce; its SHA256 must equal the token's nonce
                    claim
                full_name:
                  type: object
                  nullable: true
                  properties:
                    givenName:
                      type: string
                      nullable: true
                    familyName:
                      type: string
                      nullable: true
              required:
              - identity_token
              - authorization_code
              - nonce
        required: true
  "/v1/auth/google":
    post:
      summary: Sign in with Google
      description: Verifies the id token against Google's JWKS (iss accounts.google.com,
        aud the iOS client id, email_verified).
      tags:
      - Auth
      parameters:
      - name: X-Device-Id
        in: header
        schema:
          type: string
          format: uuid
        required: false
      responses:
        '201':
          description: new account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        "$ref": "#/components/schemas/User"
                      is_new:
                        type: boolean
                    required:
                    - token
                    - user
                    - is_new
                required:
                - data
        '200':
          description: existing account signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        "$ref": "#/components/schemas/User"
                      is_new:
                        type: boolean
                    required:
                    - token
                    - user
                    - is_new
                required:
                - data
        '401':
          description: token could not be verified
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
              required:
              - id_token
        required: true
  "/v1/auth/session":
    delete:
      summary: Sign out this session
      description: Deletes only the calling session row and unlinks its device.
      tags:
      - Auth
      security:
      - bearer: []
      responses:
        '204':
          description: signed out
        '401':
          description: not signed in
  "/v1/devices":
    post:
      summary: Register or update a device
      description: Upserts on anonymous_id so push registration and the home area
        survive until sign-in.
      tags:
      - Devices
      parameters: []
      responses:
        '201':
          description: device registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Device"
                required:
                - data
        '200':
          description: device updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Device"
                required:
                - data
        '422':
          description: invalid platform
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                anonymous_id:
                  type: string
                  format: uuid
                platform:
                  type: string
                  enum:
                  - ios
                  - android
                  - web
                push_token:
                  type: string
                  nullable: true
                app_version:
                  type: string
                home_location:
                  type: object
                  nullable: true
                  properties:
                    lat:
                      type: number
                    lng:
                      type: number
                  required:
                  - lat
                  - lng
                timezone:
                  type: string
              required:
              - anonymous_id
              - platform
        required: true
  "/v1/devices/{anonymous_id}":
    parameters:
    - name: anonymous_id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    patch:
      summary: Update push token, home location, or timezone
      tags:
      - Devices
      parameters: []
      responses:
        '200':
          description: device updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Device"
                required:
                - data
        '404':
          description: unknown device
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                push_token:
                  type: string
                  nullable: true
                push_enabled:
                  type: boolean
                app_version:
                  type: string
                home_location:
                  type: object
                  nullable: true
                  properties:
                    lat:
                      type: number
                    lng:
                      type: number
                  required:
                  - lat
                  - lng
                timezone:
                  type: string
        required: true
  "/v1/events/map":
    get:
      summary: Map pins in a viewport
      description: One MapPin per event (its earliest scheduled occurrence in the
        window) inside bbox, the soonest 500 by starts_at, with meta.truncated when
        the box held more. bbox is required and at most 5 degrees wide.
      tags:
      - Events
      parameters:
      - name: bbox
        in: query
        required: true
        schema:
          type: string
        description: w,s,e,n
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: tags[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - jdm
            - euro
            - exotic
            - classic
            - muscle
            - truck
            - ev
            - bike
            - all
        style: form
        explode: true
      - name: recurring
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: 'AC-5: 501 occurrences give the soonest 500 pins and truncated'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/MapPin"
                  meta:
                    type: object
                    properties:
                      truncated:
                        type: boolean
                    required:
                    - truncated
                required:
                - data
                - meta
        '400':
          description: bbox missing or wider than 5 degrees
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/events":
    get:
      summary: List events
      description: EventSummary rows from indexed PostGIS queries. near or bbox selects
        the earliest scheduled occurrence per event in the window (default now to
        +14 days, at most 90); host, sponsor, or q without geo lists events directly,
        announced ones included with a null next_occurrence. With near, radius_km
        defaults to 32 (80 with q) and clamps at 160. bbox with near returns the box
        with distance_m from near.
      tags:
      - Events
      parameters:
      - name: near
        in: query
        required: false
        schema:
          type: string
        description: lat,lng
      - name: radius_km
        in: query
        required: false
        schema:
          type: number
      - name: bbox
        in: query
        required: false
        schema:
          type: string
        description: w,s,e,n
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: tags[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - jdm
            - euro
            - exotic
            - classic
            - muscle
            - truck
            - ev
            - bike
            - all
        style: form
        explode: true
        description: Any tag matches
      - name: recurring
        in: query
        required: false
        schema:
          type: boolean
        description: true keeps cadence other than once
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Trigram match on title and host name, ILIKE on venue name
      - name: host
        in: query
        required: false
        schema:
          type: string
        description: user:<id>, club:<id>, or sponsor:<id>
      - name: sponsor
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Events the sponsor hosts or is attached to
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - date
          - distance
        description: distance needs near
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'AC-1: nearby meets from Lido, nearest first within a day'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/EventSummary"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                      total:
                        type: integer
                        nullable: true
                    required:
                    - next_cursor
                    - total
                required:
                - data
                - meta
        '400':
          description: near with an unusable window, sort, or coordinates
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/health":
    get:
      summary: Service health
      description: 'Liveness check: database reachability and Solid Queue lag. 503
        while the database is unreachable.'
      tags:
      - Health
      responses:
        '200':
          description: service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - degraded
                  db:
                    type: boolean
                  queue_lag_s:
                    type: integer
                    nullable: true
                required:
                - status
                - db
                - queue_lag_s
        '503':
          description: database unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - degraded
                  db:
                    type: boolean
                  queue_lag_s:
                    type: integer
                    nullable: true
                required:
                - status
                - db
                - queue_lag_s
  "/v1/me":
    get:
      summary: Current user
      description: The signed-in user with profile, linked identities, and notification
        preferences.
      tags:
      - Me
      security:
      - bearer: []
      responses:
        '200':
          description: current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/User"
                required:
                - data
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Update account fields
      description: Phase 0 accepts profile.handle and profile.display_name only.
      tags:
      - Me
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/User"
                required:
                - data
        '422':
          description: handle taken or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  type: object
                  properties:
                    handle:
                      type: string
                    display_name:
                      type: string
              required:
              - profile
        required: true
    delete:
      summary: Delete account
      description: Soft-deletes now (sessions revoked, devices unlinked) and purges
        after 30 days; signing in again before then restores the account.
      tags:
      - Me
      security:
      - bearer: []
      responses:
        '202':
          description: deletion scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      purge_after:
                        type: string
                        format: date-time
                    required:
                    - purge_after
                required:
                - data
servers:
- url: http://localhost:3000
  description: Development
- url: https://api.curbsocial.club
  description: Production (domain unconfirmed)
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Opaque session token from POST /v1/auth/apple or /v1/auth/google
  parameters:
    deviceId:
      name: X-Device-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Client-generated device UUID sent on every request from mobile
        and web
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              nullable: true
              additionalProperties: true
          required:
          - code
          - message
      required:
      - error
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        display_name:
          type: string
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        home_label:
          type: string
          nullable: true
        is_host:
          type: boolean
        links:
          type: object
          additionalProperties:
            type: string
        clubs:
          type: array
          items:
            type: object
            additionalProperties: true
        counts:
          type: object
          additionalProperties:
            type: integer
        viewer:
          type: object
          properties:
            following:
              type: boolean
            blocked:
              type: boolean
            is_self:
              type: boolean
            reported:
              type: boolean
          required:
          - following
          - blocked
          - is_self
          - reported
      required:
      - id
      - handle
      - display_name
      - is_host
      - links
      - clubs
      - counts
      - viewer
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - member
          - moderator
          - admin
        status:
          type: string
          enum:
          - active
          - suspended
          - deleted
        created_at:
          type: string
          format: date-time
        profile:
          "$ref": "#/components/schemas/Profile"
        identities:
          type: array
          items:
            type: object
            properties:
              provider:
                type: string
                enum:
                - apple
                - google
              email:
                type: string
                nullable: true
            required:
            - provider
            - email
        notification_prefs:
          type: object
          additionalProperties: true
        unread_notifications_count:
          type: integer
      required:
      - id
      - role
      - status
      - created_at
      - profile
      - identities
      - notification_prefs
    Host:
      type: object
      description: One shape for every host type (ADR 0010); switch on type only for
        the link target.
      properties:
        type:
          type: string
          enum:
          - user
          - club
          - sponsor
        id:
          type: string
          format: uuid
        slug:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        verified:
          type: boolean
        kind:
          type: string
          enum:
          - brand
          - vendor
          - venue
          nullable: true
      required:
      - type
      - id
      - slug
      - name
      - avatar_url
      - verified
      - kind
    EventSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        cover_url:
          type: string
          nullable: true
        cover_blurhash:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
            enum:
            - jdm
            - euro
            - exotic
            - classic
            - muscle
            - truck
            - ev
            - bike
            - all
        recurring:
          type: boolean
        rrule_text:
          type: string
          nullable: true
        host:
          allOf:
          - "$ref": "#/components/schemas/Host"
          nullable: true
          description: Null only while the host row is missing; HostConsistencyJob
            reports the drift
        venue:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            city:
              type: string
              nullable: true
            location:
              type: object
              properties:
                lat:
                  type: number
                lng:
                  type: number
              required:
              - lat
              - lng
          required:
          - id
          - name
          - city
          - location
        next_occurrence:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            starts_at:
              type: string
              format: date-time
            ends_at:
              type: string
              format: date-time
            timezone:
              type: string
            going_count:
              type: integer
            status:
              type: string
              enum:
              - scheduled
              - cancelled
              - completed
          required:
          - id
          - starts_at
          - ends_at
          - timezone
          - going_count
          - status
        distance_m:
          type: integer
          nullable: true
          description: Meters from near, computed in PostGIS; null without near
        source:
          type: object
          nullable: true
          properties:
            type:
              type: string
              nullable: true
            url:
              type: string
          required:
          - type
          - url
        claimed:
          type: boolean
        cadence:
          type: string
          enum:
          - once
          - weekly
          - monthly
          - seasonal
          - announced
        stale:
          type: boolean
          description: Unclaimed and not confirmed within 30 days (R-25)
        last_confirmed_at:
          type: string
          format: date-time
          nullable: true
        sponsors_preview:
          type: array
          maxItems: 2
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              slug:
                type: string
              name:
                type: string
              logo_url:
                type: string
                nullable: true
              role:
                type: string
                enum:
                - presented_by
                - coffee
                - vendor
                - partner
            required:
            - id
            - slug
            - name
            - logo_url
            - role
      required:
      - id
      - slug
      - title
      - cover_url
      - cover_blurhash
      - tags
      - recurring
      - rrule_text
      - host
      - venue
      - next_occurrence
      - distance_m
      - source
      - claimed
      - cadence
      - stale
      - last_confirmed_at
      - sponsors_preview
    MapPin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The occurrence
        event_id:
          type: string
          format: uuid
        slug:
          type: string
        lat:
          type: number
        lng:
          type: number
        starts_at:
          type: string
          format: date-time
        title:
          type: string
        going_count:
          type: integer
      required:
      - id
      - event_id
      - slug
      - lat
      - lng
      - starts_at
      - title
      - going_count
    Device:
      type: object
      properties:
        anonymous_id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - ios
          - android
          - web
        push_enabled:
          type: boolean
        push_token_present:
          type: boolean
        app_version:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        user_id:
          type: string
          format: uuid
          nullable: true
        home_location:
          type: object
          nullable: true
          properties:
            lat:
              type: number
            lng:
              type: number
          required:
          - lat
          - lng
        last_seen_at:
          type: string
          format: date-time
          nullable: true
      required:
      - anonymous_id
      - platform
      - push_enabled
      - push_token_present

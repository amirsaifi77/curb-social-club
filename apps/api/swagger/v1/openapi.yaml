                    - admin
                    - member
                  status:
                    type: string
                    enum:
                    - active
                    - invited
                    - requested
                required:
                - role
                - status
              can_manage:
                type: boolean
            required:
            - following
            - membership
            - can_manage
        required:
        - description
        - banner_url
        - links
        - events_count
        - upcoming_events
        - members_preview
        - viewer
    Sponsor:
      description: 'Sponsor detail: SponsorSummary plus the page''s own fields.'
      allOf:
      - "$ref": "#/components/schemas/SponsorSummary"
      - type: object
        properties:
          description:
            type: string
            nullable: true
          banner_url:
            type: string
            nullable: true
          website:
            type: string
            nullable: true
          links:
            type: object
            additionalProperties:
              type: string
          events_count:
            type: integer
          upcoming_events:
            type: array
            maxItems: 3
            items:
              allOf:
              - "$ref": "#/components/schemas/EventSummary"
              - type: object
                properties:
                  relation:
                    type: string
                    enum:
                    - host
                    - sponsor
                required:
                - relation
          viewer:
            type: object
            properties:
              following:
                type: boolean
            required:
            - following
        required:
        - description
        - banner_url
        - website
        - links
        - events_count
        - upcoming_events
        - viewer
    SponsorSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - brand
          - vendor
          - venue
        logo_url:
          type: string
          nullable: true
        verified:
          type: boolean
        tagline:
          type: string
          nullable: true
        followers_count:
          type: integer
        home_label:
          type: string
          nullable: true
        distance_m:
          type: integer
          nullable: true
          description: Meters from near, computed in PostGIS; null without near
      required:
      - id
      - slug
      - name
      - kind
      - logo_url
      - verified
      - tagline
      - followers_count
      - home_label
      - distance_m
    Event:
      description: 'Event detail: EventSummary plus the fields only the detail screen
        needs.'
      allOf:
      - "$ref": "#/components/schemas/EventSummary"
      - type: object
        properties:
          description:
            type: string
            nullable: true
          parking_note:
            type: string
            nullable: true
          rrule:
            type: string
            nullable: true
          dtstart:
            type: string
            format: date-time
            nullable: true
          duration_minutes:
            type: integer
          rsvp_mode:
            type: string
            enum:
            - open
            - count_only
            - 'off'
          capacity:
            type: integer
            nullable: true
          status:
            type: string
            enum:
            - draft
            - published
            - cancelled
          visibility:
            type: string
            enum:
            - public
            - unlisted
          dormant:
            type: boolean
            description: Out of lists and the map, page still served (R-27)
          hidden:
            type: boolean
            description: Only ever true for the host or an admin; the public gets

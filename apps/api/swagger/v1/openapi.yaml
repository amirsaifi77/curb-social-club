      required:
      - id
      - slug
      - name
      - avatar_url
      - verified
      - home_label
      - members_count
      - followers_count
      - join_policy
      - distance_m
      - role
    Club:
      description: 'Club detail: ClubSummary plus the page''s own fields.'

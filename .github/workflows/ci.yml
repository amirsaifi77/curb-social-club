# CI skeleton. Each job checks whether its app exists before running so the
# workflow passes while the repo is docs-only. Remove the guards once the apps
# are generated.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9
  NODE_VERSION: 22
  RUBY_VERSION: "3.3"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      packages: ${{ steps.filter.outputs.packages }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.ruby-version'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            packages:
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '**/*.md'

  docs:
    name: Docs style
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Reject em dashes in Markdown
        run: |
          if grep -rn --include='*.md' $'\xe2\x80\x94' . --exclude-dir=node_modules; then
            echo "Em dashes found. Replace with commas, periods, or parentheses."
            exit 1
          fi

  api:
    name: API (rspec, rubocop)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: cac
          POSTGRES_PASSWORD: cac
          POSTGRES_DB: cac_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cac"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://cac:cac@localhost:5432/cac_test
    steps:
      - uses: actions/checkout@v4
      - name: Check app exists
        id: exists
        run: |
          if [ -f apps/api/Gemfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "apps/api not generated yet, skipping"; fi
      - uses: ruby/setup-ruby@v1
        if: steps.exists.outputs.present == 'true'
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: apps/api
      - name: Install system deps
        if: steps.exists.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y libvips libpq-dev
      - name: Prepare database
        if: steps.exists.outputs.present == 'true'
        working-directory: apps/api
        run: bin/rails db:prepare
      - name: Rubocop
        if: steps.exists.outputs.present == 'true'
        working-directory: apps/api
        run: bundle exec rubocop
      - name: RSpec
        if: steps.exists.outputs.present == 'true'
        working-directory: apps/api
        run: bundle exec rspec
      - name: OpenAPI spec is up to date
        if: steps.exists.outputs.present == 'true'
        working-directory: apps/api
        run: |
          bundle exec rake rswag:specs:swaggerize
          git diff --exit-code -- swagger/ || (echo "Run pnpm --filter @cac/api openapi and commit the result" && exit 1)

  js:
    name: JS workspaces (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check lockfile exists
        id: exists
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "no pnpm-lock.yaml yet, skipping"; fi
      - uses: pnpm/action-setup@v4
        if: steps.exists.outputs.present == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        if: steps.exists.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        if: steps.exists.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Turbo (web, mobile, packages)
        if: steps.exists.outputs.present == 'true'
        run: pnpm turbo run lint typecheck test build --filter='!@cac/api'
        env:
          # Optional Turborepo remote cache. Leave unset to run without it.
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      - name: Generated types are up to date
        if: steps.exists.outputs.present == 'true' && hashFiles('apps/api/swagger/v1/openapi.yaml') != ''
        run: |
          pnpm --filter @cac/types generate
          git diff --exit-code -- packages/types/src || (echo "Run pnpm --filter @cac/types generate and commit" && exit 1)

  eas-build:
    name: EAS build (iOS) on tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Build and submit
        working-directory: apps/mobile
        run: |
          eas build --platform ios --profile production --non-interactive --auto-submit

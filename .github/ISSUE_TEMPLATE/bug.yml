name: Bug
description: Something is broken
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [api, web, mobile, packages, importer, docs]
  - type: input
    id: version
    attributes:
      label: App version and device
      placeholder: "iOS 26.0, iPhone 17, build 1.0.0 (12)"
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, Sentry link

# Render blueprint (ADR 0008, docs/sessions.md session 0.8): the staging API,
# its Solid Queue worker, and Postgres 16 with PostGIS, all in Oregon.
# Apply once from the Render dashboard (Blueprints > New Blueprint Instance,
# this repo, branch main). Values marked sync: false are typed into the
# dashboard on first apply and never live in the repo.
#
# The first migration enables postgis, pgcrypto, btree_gist, pg_trgm, and
# citext; Render's managed Postgres allows CREATE EXTENSION for all of them.
# Render hands out a postgres:// URL; config/database.yml rewrites the scheme
# to postgis:// so the PostGIS adapter is selected.
#
# The web service migrates during its build; the worker builds in parallel
# and may boot before the first migration lands, in which case it restarts
# until the schema exists (first apply only). If request.remote_ip in the
# first logs is Render's proxy rather than the client, set
# config.action_dispatch.trusted_proxies so rack-attack keys on real IPs.

envVarGroups:
  - name: curb-staging
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: RAILS_MAX_THREADS
        value: '5'
      - key: WEB_ORIGIN
        value: https://curb-social-club-amirsaifi77.vercel.app
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADMIN_CLIENT_ID
        sync: false
      - key: APPLE_BUNDLE_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false

services:
  - type: web
    name: curb-api-staging
    runtime: ruby
    region: oregon
    plan: starter
    branch: main
    rootDir: apps/api
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /v1/health
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: curb-staging
      - key: DATABASE_URL
        fromDatabase:
          name: curb-postgres-staging
          property: connectionString

  - type: worker
    name: curb-jobs-staging
    runtime: ruby
    region: oregon
    plan: starter
    branch: main
    rootDir: apps/api
    buildCommand: ./bin/render-build.sh
    startCommand: bin/jobs
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: curb-staging
      - key: DATABASE_URL
        fromDatabase:
          name: curb-postgres-staging
          property: connectionString

databases:
  - name: curb-postgres-staging
    region: oregon
    plan: basic-256mb
    postgresMajorVersion: '16'
    databaseName: curb_social_club_staging
    user: curb
